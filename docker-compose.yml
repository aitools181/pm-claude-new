# Deploy stack. Infra services are INTERNAL only (no host ports) so they never
# collide with other apps on a shared host. Only `web` is exposed; it proxies
# /api and /socket.io to the internal API service.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pm_platform
    volumes: ["pgdata18:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm_platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes: ["miniodata:/data"]

  # Use the official MinIO client to wait for storage and create the private
  # bucket idempotently. This is more reliable than assuming tools exist in the
  # server image, and API boot waits for this one-shot job to succeed.
  minio-init:
    image: minio/mc:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: pm-platform
    depends_on:
      minio: { condition: service_started }
    entrypoint: >
      /bin/sh -c '
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
        mc mb --ignore-existing local/"$${S3_BUCKET}";
        mc anonymous set none local/"$${S3_BUCKET}";
      '
    restart: "no"

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment:
      # ────────────────────────────────────────────────────────────────────
      # PUBLIC URL. Two ways to get this right; the first needs no edits.
      #
      # 1. PUBLIC_ORIGIN_HINTS below forwards the domain Coolify assigns to the
      #    web service. If that resolves, logins work with nothing changed.
      # 2. If it does not resolve, replace http://localhost:3000 on the APP_URL
      #    line with your public URL, e.g. https://pm.example.com - scheme
      #    included, no trailing slash, no path. Commit and redeploy.
      #
      # Editing the compose file is the only route on Coolify 4.x: variables it
      # generates from this file are marked "Managed by Docker Compose" and are
      # read-only in the UI, so APP_URL otherwise keeps its default of
      # http://localhost:3000, never matches the browser's Origin, and every
      # login fails with "Origin is not allowed by CORS".
      # ────────────────────────────────────────────────────────────────────
      APP_URL: ${APP_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PUBLIC_ORIGIN_HINTS: ${SERVICE_URL_WEB:-},${SERVICE_FQDN_WEB:-},${COOLIFY_URL:-},${COOLIFY_FQDN:-}
      DATABASE_URL: postgresql://pm:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/pm_platform
      REDIS_URL: redis://redis:6379
      SESSION_SECRET: ${SESSION_SECRET:?Set a random SESSION_SECRET of at least 32 characters in .env}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: pm-platform
      AI_PROVIDER: disabled
      NODE_ENV: production
    # Migration failures are fatal. Never start/advertise a healthy API against
    # an unknown schema.
    # Migration failures stay fatal, but the reason is printed plainly instead of
    # vanishing into an opaque "container is unhealthy" from the orchestrator.
    command:
      - sh
      - -c
      - |
        echo "BOOT:migrating"
        if ! pnpm --filter @pm/db exec drizzle-kit migrate; then
          echo "BOOT:FATAL migration failed - the API will not start."
          echo "BOOT:HINT If the error above says: password authentication failed for user pm"
          echo "BOOT:HINT then the pgdata volume was created with a different POSTGRES_PASSWORD."
          echo "BOOT:HINT Postgres only applies POSTGRES_PASSWORD when the volume is empty."
          echo "BOOT:HINT Fix on the host (password value from your .env / Coolify env vars):"
          echo "BOOT:HINT   docker exec <postgres-container> psql -U pm -d pm_platform -c \"ALTER USER pm WITH PASSWORD 'your-password';\""
          sleep 10
          exit 1
        fi
        echo "BOOT:migrate-ok"
        echo "BOOT:starting-api"
        exec node /app/apps/api/dist/main.js
    expose: ["4000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://pm:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/pm_platform
      WORKER_HEALTH_PORT: "4100"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4100/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }

  web:
    # INTERNAL_API_URL must be a build arg, not only a runtime variable: Next
    # bakes rewrite destinations into the build output.
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        INTERNAL_API_URL: http://api:4000
    environment:
      NEXT_PUBLIC_API_URL: ""
      INTERNAL_API_URL: http://api:4000
      API_URL: http://api:4000
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      api: { condition: service_healthy }

  maintenance:
    build: { context: ., dockerfile: apps/maintenance/Dockerfile }
    profiles: ["maintenance"]
    environment:
      DATABASE_URL: postgresql://pm:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/pm_platform
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_BUCKET: pm-platform
    volumes: ["backups:/backups"]
    depends_on:
      postgres: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }

volumes:
  pgdata18:
  miniodata:
  backups:
